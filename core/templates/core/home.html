<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UVA Smart Parking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9fafc;
            color: #232d4b;
            margin: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #232d4b;
            padding: 10px 20px;
            color: white;
        }

        .navbar h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .logout-button {
            background-color: #e57200;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .logout-button:hover {
            background-color: #cc6600;
        }

        .content {
            text-align: center;
            padding: 80px 20px 20px 20px;
        }

        .content h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 1.2rem;
            margin: 20px auto;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>UVA Smart Parking</h1>
        <a href="{% url 'logout' %}" class="logout-button">Logout</a>
    </div>

    <div class="content">
        <h2>Welcome!</h2>
        <p>Find available parking spots across Grounds in real time. Manage permits, view garage occupancy, and plan your trips efficiently.</p>
    </div>
</body>
</html>
