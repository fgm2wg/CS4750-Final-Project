<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - UVA Smart Parking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9fafc;
            color: #232d4b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 360px;
            text-align: center;
        }

        h1 {
            margin-bottom: 24px;
            color: #232d4b;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
        }

        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: white;
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 12px;
            padding-right: 30px;
        }

        button {
            background-color: #e57200;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #cc6600;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .success {
            color: green;
            margin-top: 10px;
        }

        a {
            color: #232d4b;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Account</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="first_name" placeholder="First Name" required><br>
        <input type="text" name="last_name" placeholder="Last Name" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="text" name="phone" placeholder="Phone (10 digits)" required pattern="\d{10}" title="10 digits"><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <select name="role" id="roleSelect" required>
            <option value="">Select role</option>
            <option value="STUDENT">Student</option>
            <option value="EMPLOYEE">Employee</option>
        </select><br>

        <div id="studentFields" style="display:none;">
            <input type="text" name="uva_student_id" placeholder="UVA Student ID"><br>
            <input type="text" name="level" placeholder="Level (Undergrad/Grad)"><br>
            <input type="text" name="school" placeholder="School"><br>
        </div>

        <div id="employeeFields" style="display:none;">
            <input type="text" name="employee_id" placeholder="Employee ID"><br>
            <input type="text" name="department" placeholder="Department"><br>
            <input type="text" name="title" placeholder="Title"><br>
        </div>

        <button type="submit">Sign Up</button>
    </form>

    {% for message in messages %}
    <p class="{{ message.tags }}">{{ message }}</p>
    {% endfor %}

    <p style="margin-top:15px;">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
</div>

<script>
    const roleSelect = document.getElementById('roleSelect');
    const studentFields = document.getElementById('studentFields');
    const employeeFields = document.getElementById('employeeFields');

    const studentInputs = studentFields.querySelectorAll('input');
    const employeeInputs = employeeFields.querySelectorAll('input');

    roleSelect.addEventListener('change', () => {
        if (roleSelect.value === 'STUDENT') {
            studentFields.style.display = 'block';
            employeeFields.style.display = 'none';
            studentInputs.forEach(input => input.required = true);
            employeeInputs.forEach(input => input.required = false);
        } else if (roleSelect.value === 'EMPLOYEE') {
            studentFields.style.display = 'none';
            employeeFields.style.display = 'block';
            studentInputs.forEach(input => input.required = false);
            employeeInputs.forEach(input => input.required = true);
        } else {
            studentFields.style.display = 'none';
            employeeFields.style.display = 'none';
            studentInputs.forEach(input => input.required = false);
            employeeInputs.forEach(input => input.required = false);
        }
    });
</script>
</body>
</html>
